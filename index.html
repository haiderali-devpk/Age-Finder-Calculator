<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:description" content="Calculate your exact age easily with this tool." />
<meta property="og:image" content="https://age-finder-calculator.pages.dev/age-calculator-thumbnail.png.png" />
  <title>Age Calculate</title>
  <link rel="icon" href="time.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Age Calculator</h3>
  <p>Hello, welcome to the Age Calculator! Please enter your birth date below to calculate your age.</p>
  <form id="ageForm">
    <label for="birthDate">Birth Date:</label>
    <input type="date" id="birthDate" name="birthDate" required>
    <button type="button" id="calculateBtn">Calculate Age</button>
  </form>

  <div id="result"></div>

  <script src="javascript.js"></script>
</body>
</html>
